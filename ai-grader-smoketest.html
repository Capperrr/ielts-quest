<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IELTS Quest AI 测试</title><style>body{font:16px system-ui;background:#0c1930;color:#e6f5ff;padding:16px;max-width:720px;margin:auto}input,button{font:inherit;padding:12px;border-radius:8px;margin:6px 0}input{display:block;width:95%}button{background:#52dfb3;border:0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#193451;padding:18px;border-radius:10px}</style></head><body><h2>IELTS Quest · Hy4 首次测试</h2><p>此页面仅用于联调，不是正式学生网站；不显示密码或 Access Token。请仅用测试账号。</p><form id="f"><label>测试学生用户名<input id="u" value="ielts_manual_test01" autocomplete="username"></label><label>测试账号密码<input id="p" type="password" autocomplete="current-password"></label><button id="b">第一步：只测试学生登录（不消耗 AI Tokens）</button><button id="gradeBtn" type="button" disabled>第二步：提交示例作文给 Hy4（消耗少量 Tokens）</button></form><p>若登录失败，下方会显示错误代码。请只分享「测试状态」，不要分享密码、API Key 或 Access Token。</p><h3>测试状态</h3><pre id="status">准备测试</pre><h3>模型返回报告</h3><pre id="report">尚未测试</pre><script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script><script>
const pk="eyJhbGciOiJSUzI1NiIsImtpZCI6IjgxZWVlYjc5LTAxZjAtNDZkOC04NzI3LWE0ODljNWVhYjRiZSJ9.eyJpc3MiOiJodHRwczovL2llbHRzLXF1ZXN0LWQ4Z3pqNnFvNDgzMDFlNWQ1LmFwLXNoYW5naGFpLnRjYi1hcGkudGVuY2VudGNsb3VkYXBpLmNvbSIsInN1YiI6ImFub24iLCJhdWQiOiJpZWx0cy1xdWVzdC1kOGd6ajZxbzQ4MzAxZTVkNSIsImV4cCI6NDA5ODMwOTQ4MywiaWF0IjoxNzk0NjI2MjgzLCJub25jZSI6InVhZ2pyLU54VDFTTXNMSTNwZzFrbVEiLCJhdF9oYXNoIjoidWFnanItTnhUMVNNc0xJM3BnMWttUSIsIm5hbWUiOiJBbm9ueW1vdXMiLCJzY29wZSI6ImFub255bW91cyIsInByb2plY3RfaWQiOiJpZWx0cy1xdWVzdC1kOGd6ajZxbzQ4MzAxZTVkNSIsIm1ldGEiOnsicGxhdGZvcm0iOiJQdWJsaXNoYWJsZUtleSJ9LCJyb2xlIjoiYW5vbiIsImlzX2Fub255bW91cyI6dHJ1ZSwiYXBwX21ldGFkYXRhIjp7InByb3ZpZGVyIjoiYW5vbnltb3VzIiwicHJvdmlkZXJzIjpbImFub255bW91cyJdfSwidXNlcl9tZXRhZGF0YSI6eyJuYW1lIjoiQW5vbnltb3VzIn0sInVzZXJfdHlwZSI6IiIsImNsaWVudF90eXBlIjoiY2xpZW50X3VzZXIiLCJpc19zeXN0ZW1fYWRtaW4iOmZhbHNlfQ.LO7Z7yWV7ja2A7prmzuBn52uwGV2m2eQSd8h5VWeNmSuxVpEK8Sgy4pfpBFutimFxkkhDoHt3Qu3deSFDa1v7CycUjRX-S9zLUP9_zs-Fvf-sSoRGZbd6UvmwNECep19t-7M0Vt9Qm5CZpoWavNOqth9t8d14iHPjWqGoIJ3blMsD28yQuCLw0knnYRkQyml-D9xKwo1_X2xIjaCs3l6SEYytNW2mZEwA5tZVgstjjfm7_9RiLIOFTBoZWjMtmKlpA0pscHV-n7nopYD9OKwDGx42cKSUyW6PKqWGlCa2MB7ZbBzuWV0on67mpRLB2tRLrIFWcTmgx5gFPNNe7mhPQ";
const api="https://ielts-quest-d8gzj6qo48301e5d5-1532053589.ap-shanghai.app.tcloudbase.com/api/ielts-essay-grader";
const status=document.getElementById('status'),report=document.getElementById('report'),btn=document.getElementById('b');
const sample="Some people believe that universities should focus only on academic subjects, while others think practical skills are important. Discuss both views and give your opinion.\n\nAcademic subjects allow students to develop strong theoretical knowledge. For example, an engineering student must understand mathematics and physics before designing safe equipment. Studying research also encourages critical thinking and helps learners identify reliable evidence.\n\nHowever, practical skills are necessary because graduates need to apply their knowledge at work. Internships give students opportunities to solve real problems, while group projects teach teamwork and communication. These experiences can also improve confidence and make the transition to employment easier.\n\nIn my opinion, universities should combine academic learning with practical activities. Students benefit most when they can understand a concept and then use it in a realistic situation. Therefore, degree programmes should protect academic standards while offering more opportunities for meaningful practice.";

let sessionUser=null,authClient=null;
const gradeBtn=document.getElementById('gradeBtn');
function errorDetails(err){
 const code=err?.code||err?.error_code||err?.name||'';
 const message=String(err?.message||err?.error_description||'未知错误').slice(0,250);
 const status=err?.status||err?.statusCode||'';
 return [code&&('代码：'+code),status&&('HTTP：'+status),message].filter(Boolean).join('\n');
}
function authInstance(app){return typeof app.auth==='function'?app.auth():app.auth}
async function sessionToken(auth){
 const res=await auth.getSession();
 if(res?.error)throw res.error;
 const sess=res?.data?.session||res?.session;
 if(!sess?.user)throw Error('账号验证后仍无有效登录会话');
 let token=sess.access_token||sess.accessToken;
 if(!token&&typeof auth.getAccessToken==='function'){
   const t=await auth.getAccessToken();
   token=typeof t==='string'?t:t?.accessToken||t?.data?.accessToken||t?.access_token||t?.data?.access_token||'';
 }
 if(!token)throw Error('已登录，但无法读取 Access Token');
 return {token,user:sess.user};
}
document.getElementById('f').onsubmit=async e=>{
e.preventDefault();btn.disabled=true;gradeBtn.disabled=true;sessionUser=null;status.textContent='正在验证测试学生账号（不会调用 AI）……';report.textContent='尚未提交测试作文';
try{
 if(!window.cloudbase?.init)throw Error('CloudBase SDK 未加载，请检查网络');
 const app=cloudbase.init({env:'ielts-quest-d8gzj6qo48301e5d5',region:'ap-shanghai',accessKey:pk,auth:{detectSessionInUrl:false}});
 const auth=authInstance(app);
 if(typeof auth?.signInWithPassword!=='function')throw Error('浏览器 SDK 不支持 signInWithPassword');
 const username=document.getElementById('u').value.trim(),password=document.getElementById('p').value;
 if(!username||!password)throw Error('请填写测试用户名和密码');
 document.getElementById('p').value='';
 const response=await auth.signInWithPassword({username,password});
 if(response?.error)throw response.error;
 const logged=await sessionToken(auth);
 sessionUser=logged.user;authClient=auth;
 status.textContent='登录成功！CloudBase 返回有效会话。\n登录源：'+location.origin+'\n现在可以点击第二步提交 AI 测试作文。';
 gradeBtn.disabled=false;
}catch(err){
 status.textContent='登录阶段失败（尚未调用 AI）\n'+errorDetails(err)+'\n网页来源：'+location.origin+'\n若提示网络/CORS/非法来源，请检查 CloudBase → 环境配置 → 安全来源 是否允许 capperrr.github.io。';
}finally{btn.disabled=false}
};
gradeBtn.onclick=async()=>{
 if(!sessionUser||!authClient){status.textContent='请先完成第一步登录';return}
 gradeBtn.disabled=true;
 status.textContent='正在调用 CloudBase 网关与 Hy4（可能消耗少量 Tokens）……';report.textContent='正在生成……';
 try{
  const {token}=await sessionToken(authClient);
  const response=await fetch(api,{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
   body:JSON.stringify({
    task:'task2',
    question:'Some people believe that universities should focus only on academic subjects, while others think practical skills are important. Discuss both views and give your opinion.',
    essay:sample,
    figure:'',zh:''
   })
  });
  const body=await response.json().catch(()=>({}));
  if(!response.ok)throw Error('HTTP '+response.status+'：'+String(body.code||body.error||body.message||'服务器未返回详细错误').slice(0,240));
  if(typeof body.report!=='string'||!body.report.trim())throw Error('HTTP '+response.status+'：服务器未返回有效 report');
  report.textContent=body.report;
  status.textContent='成功！CloudBase 返回 Hy4 AI 批改报告（HTTP '+response.status+'）。';
 }catch(err){status.textContent='AI 调用阶段失败：\n'+errorDetails(err);report.textContent='没有收到 AI 批改报告';}
 finally{gradeBtn.disabled=false}
};
</script></body></html>
