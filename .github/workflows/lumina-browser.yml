name: LUMINA Browser Smoke Test
on:
  pull_request:
    paths:
      - 'lumina-run/**'
      - '.github/workflows/lumina-browser.yml'
  push:
    branches: [main]
    paths:
      - 'lumina-run/**'
      - '.github/workflows/lumina-browser.yml'
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix lumina-run --no-save --no-package-lock playwright@1.56.1
      - run: ./lumina-run/node_modules/.bin/playwright install --with-deps chromium
      - name: Start static HTTP server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/lumina-server.log 2>&1 &
          sleep 2
      - name: Run game browser tests
        run: node lumina-run/smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lumina-2-screenshots
          path: lumina-run/screenshot-*.png
          if-no-files-found: ignore
