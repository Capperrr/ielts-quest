name: Validate LUMINA Runner
on:
  pull_request:
    paths:
      - 'lumina-run/**'
      - '.github/workflows/lumina-validate.yml'
  push:
    branches: [main]
    paths:
      - 'lumina-run/**'
      - '.github/workflows/lumina-validate.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node lumina-run/verify.cjs
